# CI — Spetser AI (Phase 12, Lesson 12.5)
name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  backend-tests:
    name: Backend tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run pytest (critical suites)
        run: |
          python -m pytest tests/unit -q
          python -m pytest tests/integration/test_chat_endpoint.py \
            tests/integration/test_rate_limits.py \
            tests/integration/test_hardening.py \
            tests/integration/test_error_envelope.py \
            tests/integration/test_observability.py \
            tests/integration/test_auth_routes.py -q

  frontend-lint-build:
    name: Frontend lint + test + build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        run: npm ci || npm install

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm run test

      - name: Build
        run: npm run build

  compose-config:
    name: Validate docker compose
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Create env files for validation
        run: cp backend/.env.example backend/.env

      - name: Validate compose file
        run: |
          # Dummy password so required env interpolates for config validation
          export POSTGRES_PASSWORD=ci-validate-only
          docker compose -f docker-compose.yml config --quiet

  docker-build:
    name: Build Docker images
    runs-on: ubuntu-latest
    needs: [backend-tests, frontend-lint-build]
    steps:
      - uses: actions/checkout@v4

      - name: Build backend image
        run: docker build -t spetser-backend:ci ./backend

      - name: Build frontend image
        run: docker build -t spetser-frontend:ci ./frontend
