<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Spetser AI — مساعدك الأكاديمي الذكي" />
    <title>Spetser AI</title>
    <script>
      // Apply the stored theme BEFORE first paint to avoid a flash of the
      // wrong palette. Default is light (the parchment design system);
      // dark is an explicit opt-in via the in-app toggle.
      (function () {
        try {
          var t = localStorage.getItem('spetser-theme');
          document.documentElement.setAttribute(
            'data-theme',
            t === 'dark' ? 'dark' : 'light',
          );
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'light');
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
