# frontend/nginx.conf — SPA + reverse proxy to backend (Phase 12, Lesson 12.2)
# The API base URL is injected at build time as /api (same-origin via proxy).

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Gzip common assets
    gzip on;
    gzip_types text/plain text/css application/json application/javascript
               image/svg+xml text/xml application/xml;
    gzip_min_length 1024;

    # Hashed static assets can be cached hard
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy API to the backend container (compose service name: backend)
    location /api/ {
        proxy_pass http://backend:8000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;
        # SSE (streaming chat)
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
